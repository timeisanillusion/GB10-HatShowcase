# Ollama tuning for the Dell GB10 (Grace Blackwell) VLM Showcase.
#
# Install with:   ./setup-ollama-tuning.sh
# Or manually:    sudo install -D -m644 ollama-override.conf \
#                   /etc/systemd/system/ollama.service.d/override.conf
#                 sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# Verify it took effect:
#   systemctl show ollama -p Environment | tr ' ' '\n' | grep -E 'OLLAMA|GGML'

[Service]
# --- Blackwell (GB10) stability ---
# These address CUDA VMM-related assertion failures (e.g. CUDA_POOL_VMM_MAX_SIZE)
# and flash-attention issues observed on this platform. Keep them unless you have
# verified your Ollama build is stable without them on your hardware.
Environment="OLLAMA_CONTEXT_LENGTH=8192"
Environment="GGML_CUDA_NO_VMM=1"
Environment="OLLAMA_MAX_VRAM_OVERHEAD=1000000"
Environment="OLLAMA_FLASH_ATTENTION=0"

# --- Showcase behaviour ---
# Keep both selectable models resident (no ~20s reload when switching models),
# and serve one request at a time for predictable unified-memory usage.
Environment="OLLAMA_MAX_LOADED_MODELS=2"
Environment="OLLAMA_NUM_PARALLEL=1"

# --- Optional: remote access to the Ollama API ---
# Only needed if you call Ollama from another machine. The showcase server runs
# on the GB10 itself and uses 127.0.0.1, so these can be safely omitted.
Environment="OLLAMA_HOST=0.0.0.0"
Environment="OLLAMA_ORIGINS=*"
